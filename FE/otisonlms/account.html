<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OtisonLMS - Thông tin tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/account.css" rel="stylesheet">
  <link  href="assets/css/footer.css" rel="stylesheet">
</head>
<body>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/nav.js"></script>
<script>requireAuth();</script>
<div id="appNav"></div>



<div class="bg-light border-bottom">
  <div class="container py-2 d-flex flex-wrap gap-2 justify-content-end">
    <a class="btn btn-outline-primary btn-sm" href="dashboard.html">Dashboard</a>
    <a class="btn btn-outline-primary btn-sm" href="stats.html">Thống kê</a>
    <a class="btn btn-outline-primary btn-sm" href="courses.html">Khóa học</a>
    <button class="btn btn-outline-danger btn-sm" id="logout">Logout</button>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card profile-card p-4 text-center">
        <div class="avatar-ring" id="avatarInitial">A</div>
        <h4 id="accName" class="mb-1">Đang tải...</h4>
        <p class="text-muted mb-3" id="accRole">—</p>
        <div class="d-flex justify-content-between text-start">
          <div>
            <div class="info-label">Email</div>
            <div class="fw-semibold" id="accEmail">—</div>
          </div>
          <div>
            <div class="info-label">ID người dùng</div>
            <div class="fw-semibold" id="accId">—</div>
          </div>
        </div>
        <hr>
        <div class="text-start small">
          <div class="info-label">Trạng thái</div>
          <span class="badge text-bg-success" id="accStatus">Đang hoạt động</span>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card shadow-soft p-4 mb-4">
        <h5 class="mb-3">Thông tin cá nhân</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="info-label">Họ và tên</div>
            <div class="fw-semibold" id="accFullName">—</div>
          </div>
          <div class="col-md-6">
            <div class="info-label">Vai trò</div>
            <div class="fw-semibold" id="accRoleFull">—</div>
          </div>
          <div class="col-md-6">
            <div class="info-label">Tham gia từ</div>
            <div class="fw-semibold" id="accJoined">—</div>
          </div>
          <div class="col-md-6">
            <div class="info-label">Lần đăng nhập cuối</div>
            <div class="fw-semibold" id="accLastLogin">—</div>
          </div>
        </div>
      </div>

      <div class="card shadow-soft p-4">
        <h5 class="mb-3">Hoạt động gần đây</h5>
        <div class="d-flex align-items-start mb-3">
          <div class="timeline-dot"></div>
          <div>
            <div class="fw-semibold" id="activitySummary">Chưa có dữ liệu</div>
            <div class="text-muted small" id="activityTime">—</div>
          </div>
        </div>
        <div class="d-flex align-items-start">
          <div class="timeline-dot bg-secondary"></div>
          <div>
            <div class="fw-semibold">Thiết bị bạn đang dùng</div>
            <div class="text-muted small" id="activityDevice"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
</div>

<script src="assets/js/ui.js"></script>
<script src="assets/js/account.js"></script>
  <div id="appFooter"></div>
    <script src="assets/js/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

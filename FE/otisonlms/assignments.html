<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtisonLMS - Bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>requireAuth();</script>

  <div id="appNav"></div>

  <div class="main-content">

    <div class="container py-4">

      <!-- Header + Filters -->
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <h4 class="mb-0 me-auto">Bài tập</h4>

        <!-- Course input -->
        <div class="flex-grow-1" style="min-width:260px;max-width:340px">
          <input id="courseInput" class="form-control" list="courseDatalist"
            placeholder="Chọn / gõ tên hoặc ID khóa học..." autocomplete="off">
          <datalist id="courseDatalist"></datalist>
          <input type="hidden" id="courseId">
        </div>

        <!-- Lesson dropdown (show sau khi chọn course) -->
        <div id="lessonWrap" class="d-none" style="min-width:220px;max-width:240px">
          <select id="lessonFilter" class="form-select" disabled>
            <option value="">-- Chọn bài học --</option>
          </select>
        </div>

        <!-- Search assignments -->
        <input id="q" class="form-control" style="min-width:200px;max-width:240px" placeholder="Tìm bài tập...">

        <!-- Page size -->
        <select id="pageSize" class="form-select" style="max-width:150px">
          <option value="6">6 / trang</option>
          <option value="9">9 / trang</option>
        </select>

        <!-- Create (TEACHER/ADMIN JS sẽ ẩn/hiện) -->
        <a class="btn btn-primary btn-sm" id="btnCreateAssignment" href="assignment_detail.html?mode=create">
          + Tạo bài tập
        </a>
      </div>

      <!-- ✅ Course browse (chỉ hiện khi chưa chọn course) -->
      <div id="courseBrowse" class="card shadow-soft p-3 mb-3 d-none">
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="fw-bold me-auto">Các khóa học</div>
          <div class="small-muted" id="courseBrowseMeta"></div>
        </div>
        <div class="row g-2" id="courseBrowseList"></div>
        <div class="d-flex justify-content-end mt-2">
          <div id="courseBrowsePager"></div>
        </div>
      </div>

      <!-- ✅ Lesson browse (hiện khi đã chọn course nhưng chưa chọn lesson) -->
      <div id="lessonBrowse" class="card shadow-soft p-3 mb-3 d-none">
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="fw-bold me-auto">Các bài học trong khóa học</div>
          <div class="small-muted" id="lessonBrowseMeta"></div>
        </div>
        <div class="row g-2" id="lessonBrowseList"></div>
        <div class="d-flex justify-content-end mt-2">
          <div id="lessonBrowsePager"></div>
        </div>
      </div>

      <!-- Assignment list -->
      <div class="row g-3" id="list"></div>

      <!-- Pager -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="small-muted" id="meta"></div>
        <div id="pager"></div>
      </div>

      <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
    </div>

  </div>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pagination.js"></script>
  <script src="assets/js/assignments.js"></script>

  <div id="appFooter"></div>
  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

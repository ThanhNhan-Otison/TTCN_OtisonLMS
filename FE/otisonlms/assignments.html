<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtisonLMS - Bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/assignments.js"></script>
  <script>requireAuth();</script>



  <script src="assets/js/nav.js"></script>
  <div id="appNav"></div>

  <div class="container py-4">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <h4 class="mb-0 me-auto">Bài tập</h4>

      <!-- ✅ Course input (gõ tìm) + datalist -->
      <div style="min-width:260px;max-width:320px">
        <input id="courseInput" class="form-control" list="courseDatalist" placeholder="Chọn / gõ tên khóa học..."
          autocomplete="off">
        <datalist id="courseDatalist"></datalist>
        <!-- nơi lưu id thật -->
        <input type="hidden" id="courseId">
      </div>

      <!-- ✅ Lesson select -->
      
      <div id="lessonWrap" class="d-none">
        <select id="lessonFilter" class="form-select" style="max-width:220px" disabled>
          <option value="">-- Chọn bài học --</option>
        </select>
      </div>


      <input id="q" class="form-control" style="max-width:220px" placeholder="Tìm bài tập...">

      <select id="pageSize" class="form-select" style="max-width:150px">
        <option value="6">6 / trang</option>
        <option value="9">9 / trang</option>
      </select>

      <!-- ✅ nút tạo có id để JS ẩn/hiện -->
      <a class="btn btn-primary btn-sm" id="btnCreateAssignment" href="assignment_detail.html?mode=create">
        + Tạo bài tập
      </a>
    </div>

    <!-- <a class="btn btn-outline-primary btn-sm" href="submissions.html">Bài nộp</a> -->


    <div class="row g-3" id="list"></div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <div class="small-muted" id="meta"></div>
      <div id="pager"></div>
    </div>

    <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pagination.js"></script>
  <div id="appFooter"></div>
  <script src="assets/js/footer.js"></script>
</body>

</html>

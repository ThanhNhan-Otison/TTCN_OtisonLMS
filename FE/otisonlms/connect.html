  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>requireAuth();</script>
  <div id="appNav"></div>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card-soft p-4 h-100">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h3 class="h5 mb-0">Lưu thông tin kết nối</h3>
            <span class="tag-role">BETA</span>
          </div>
          <p class="text-muted small mb-4">Nhập thông tin bạn bè muốn kết nối để đội ngũ hỗ trợ hoặc cố vấn có thể giúp
            bạn ghép nhóm.</p>
          <form id="connectionForm" class="vstack gap-3">
            <div>
              <label class="form-label">Họ và tên bạn</label>
              <input class="form-control" id="ownerName" placeholder="Nguyễn Văn A" required>
            </div>
            <div>
              <label class="form-label">Email của bạn</label>
              <input type="email" class="form-control" id="ownerEmail" placeholder="ban@stu.edu.vn" required>
            </div>
            <div>
              <label class="form-label">Tên bạn bè muốn kết nối</label>
              <input class="form-control" id="friendName" placeholder="Trần Thị B" required>
            </div>
            <div>
              <label class="form-label">Email bạn bè (tuỳ chọn)</label>
              <input type="email" class="form-control" id="friendEmail" placeholder="banbe@stu.edu.vn">
            </div>
            <div id="courseFieldWrap">
              <label class="form-label">Khóa học muốn học chung (tuỳ chọn)</label>
              <select class="form-select" id="courseName">
                <option value="">Chọn khóa học</option>
              </select>
            </div>
            <div>
              <label class="form-label">Ghi chú thêm (tuỳ chọn)</label>
              <textarea class="form-control" id="note" rows="2"
                placeholder="Thời gian rảnh, mục tiêu học..."></textarea>
            </div>
            <div class="d-flex gap-2 align-items-center">
              <button class="btn btn-primary" type="submit">Lưu yêu cầu</button>
              <button class="btn btn-outline-danger" type="button" id="clearAll">Xóa tất cả</button>
              <span class="small text-muted" id="formStatus"></span>
            </div>
          </form>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card-soft p-4 h-100">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h3 class="h5 mb-0">Danh sách kết nối đã lưu</h3>
            <span class="text-muted small" id="counter"></span>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <input class="form-control" id="filterKeyword" placeholder="Tìm tên, email hoặc ghi chú">
            </div>
            <div class="col-md-6">
              <select class="form-select" id="filterCourse">
                <option value="">Tất cả khóa học</option>
              </select>
            </div>
          </div>
          <div id="emptyState" class="text-center text-muted py-5">
            <p class="mb-1">Chưa có kết nối nào.</p>
            <p class="small">Điền form bên trái để bắt đầu.</p>
          </div>
          <div class="list-group list-group-flush" id="connectionList"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/js/connect.js"></script>

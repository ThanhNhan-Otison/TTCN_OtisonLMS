<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtisonLMS - Khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">

</head>

<body>

  <div id="appNav"></div>
  <div class="main-content">
    <div class="container py-4">
      <!-- ADMIN COURSE TABS -->
      <div id="adminCourseTabs" class="mb-3 d-none admin-tabs">
        <ul class="nav nav-tabs">
          <li class="nav-item">
            <button class="nav-link active" data-tab="all">Tất cả</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-tab="draft">Draft</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-tab="publish">Published</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-tab="hidden">Hidden</button>
          </li>
        </ul>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <h4 class="mb-0 me-auto" style="color: whitesmoke; font-weight: bold; font-size: xx-large;  text-shadow:
    -0 0 0 black,
    1px -0 0 black,
    -0 0 0 black,
    1px 0 0 black;">Danh sách khóa học</h4>
        <input id="q" class="form-control" style="max-width:280px" placeholder="Tìm theo tên...">
        <select id="pageSize" class="form-select" style="max-width:150px; ">
          <option value="6">6 / trang</option>
          <option value="9">9 / trang</option>
          <option value="12">12 / trang</option>
        </select>
        <a class="btn btn-primary btn-sm d-none" id="btnAssignments" href="assignments.html">Bài tập</a>
        <a class="btn btn-primary btn-sm d-none" id="btnUpload" href="create_course.html">Upload Khóa Học</a>
      </div>

      <div class="row g-3" id="courseList"></div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="small-muted" id="meta" style="color: white
        ;"></div>
        <div id="pager"></div>
      </div>

      <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
    </div>

  </div>
  <div id="appFooter"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pagination.js"></script>
  <script src="assets/js/courses.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

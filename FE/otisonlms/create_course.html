<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OtisonLMS - Tạo khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
    <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>requireAuth();</script>
    <div id="appNav"></div>


    <div class="main-content">
        <div class="bg-light border-bottom">
            <div class="container py-2 d-flex flex-wrap gap-2 justify-content-end">
                <a class="btn btn-outline-primary btn-sm" href="assignments.html">Bài tập</a>
                <a class="btn btn-outline-primary btn-sm" href="create_course.html">Tạo khóa học</a>
                <button class="btn btn-outline-danger btn-sm" id="logout">Logout</button>
            </div>
        </div>

        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="mb-4 text-center">Tạo khóa học mới</h4>
                            <form id="create-course-form">
                                <div class="mb-3">
                                    <label for="courseName" class="form-label">Tên khóa học</label>
                                    <input type="text" class="form-control" id="courseName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="courseDescription" class="form-label">Mô tả</label>
                                    <textarea class="form-control" id="courseDescription" rows="3" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Tạo khóa học</button>
                            </form>
                            <div id="create-course-message" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="assets/js/create_course.js"></script>
    <div id="appFooter"></div>
    <script src="assets/js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

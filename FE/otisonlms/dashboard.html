<div class="container py-4">
  <div class="row g-3">
    <div class="col-md-8">
      <div class="card shadow-soft p-4">
        <h4 class="mb-1">Xin chào 👋</h4>
        <div class="small-muted">Email: <span id="email"></span> • Role: <span id="role" class="badge badge-soft">?</span></div>
        <hr/>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="p-3 bg-white border rounded-3">
              <div class="small-muted">Tổng khóa học</div>
              <div class="fs-3 fw-bold" id="countCourses">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white border rounded-3">
              <div class="small-muted">Bài tập</div>
              <div class="fs-3 fw-bold" id="countAssignments">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white border rounded-3">
              <div class="small-muted">Bài nộp</div>
              <div class="fs-3 fw-bold" id="countSubmissions">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
<!-- ===== ADMIN: USERS MANAGEMENT ===== -->
<div class="row g-3 mt-2">
  <div class="col-12">
    <div class="card shadow-soft p-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h5 class="mb-1">Tài khoản hệ thống</h5>
          <div class="small-muted">Chỉ ADMIN. Phân loại theo USER / TEACHER. Có thể Ẩn hoặc Duyệt.</div>
        </div>

        <div class="d-flex gap-2">
          <input id="userSearch" class="form-control form-control-sm" style="min-width:240px"
                 placeholder="Tìm theo email / tên...">
          <button id="btnReloadUsers" class="btn btn-outline-primary btn-sm">Tải lại</button>
        </div>
      </div>

      <ul class="nav nav-pills mt-3" id="userTabs">
        <li class="nav-item">
          <button class="nav-link active" data-role="USER" type="button">USER</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-role="TEACHER" type="button">TEACHER</button>
        </li>
      </ul>

      <div class="table-responsive mt-3">
        <table class="table align-middle">
          <thead>
            <tr>
              <th style="width: 56px;">#</th>
              <th>Email</th>
              <th>Họ tên</th>
              <th>Role</th>
              <th>Trạng thái</th>
              <th class="text-end" style="width: 220px;">Hành động</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr><td colspan="6" class="small-muted">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<!-- ===== /ADMIN: USERS MANAGEMENT ===== -->

    <div class="col-md-4">

          <a class="btn btn-outline-primary" href="quiz.html">Quiz</a>
        </div>
      </div>
    </div>
  </div>

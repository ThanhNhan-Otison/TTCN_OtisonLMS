<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thông tin cá nhân - OtisonLMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <div class="page-wrapper">
    <div id="appNav"></div>
    <div class="main-content">
      <main class="container py-5">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-6">
            <div class="card shadow-soft p-4">
              <div class="d-flex align-items-center mb-3">
                <h2 class="mb-0 me-auto text-center w-100">Thông tin cá nhân</h2>
              </div>
              <div id="userInfoBox" class="mb-3">
                <div class="text-center text-muted">Đang tải thông tin...</div>
              </div>
              <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-primary" id="btnEditProfile">Chỉnh sửa</button>
                <a href="home.html" class="btn btn-secondary">Quay lại trang chủ</a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="appFooter"></div>
  </div>
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tài khoản</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <!-- Tabs -->
          <ul class="nav nav-tabs" id="profileTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="tab-info" data-bs-toggle="tab" data-bs-target="#pane-info"
                type="button" role="tab">Chỉnh sửa thông tin</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tab-pass" data-bs-toggle="tab" data-bs-target="#pane-pass" type="button"
                role="tab">Đổi mật khẩu</button>
            </li>
          </ul>
          <div class="tab-content pt-3">
            <!--  PROFILE -->
            <div class="tab-pane fade show active" id="pane-info" role="tabpanel">
              <form id="profileForm">
                <div class="mb-3">
                  <label class="form-label">Họ tên</label>
                  <input class="form-control" id="pfFullName" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input class="form-control" id="pfEmail" type="email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Ngày sinh</label>
                  <input class="form-control" id="pfNgaySinh" type="date">
                </div>
                <div class="mb-3">
                  <label class="form-label">Số điện thoại</label>
                  <input class="form-control" id="pfSoDienThoai">
                </div>
                <div class="mb-3">
                  <label class="form-label">Giới tính</label>
                  <select class="form-select" id="pfGioiTinh">
                    <option value="">-- Chọn --</option>
                    <option value="true">Nam</option>
                    <option value="false">Nữ</option>
                  </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                  <button type="submit" class="btn btn-primary" id="pfSaveBtn">Lưu</button>
                </div>
              </form>
            </div>
            <!-- CHANGE PASSWORD -->
            <div class="tab-pane fade" id="pane-pass" role="tabpanel">
              <form id="passwordForm">
                <div class="mb-3">
                  <label class="form-label">Mật khẩu cũ</label>
                  <input class="form-control" id="pwOld" type="password" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Mật khẩu mới</label>
                  <input class="form-control" id="pwNew" type="password" minlength="6" required>
                  <div class="form-text">Tối thiểu 6 ký tự</div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Nhập lại mật khẩu mới</label>
                  <input class="form-control" id="pwNew2" type="password" minlength="6" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                  <button type="submit" class="btn btn-primary" id="pwSaveBtn">Đổi mật khẩu</button>
                </div>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>requireAuth();</script>
  <script src="assets/js/info.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

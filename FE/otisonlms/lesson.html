<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtisonLMS - Bài học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <div class="page-wrapper">
    <div id="appNav"></div>
    <div class="main-content">
      <div class="container py-4">
        <div class="card shadow-soft p-4">
          <h4 id="lessonName">...</h4>
          <div id="content" class="mt-2"></div>
          <div class="mt-4">
            <h6>Video</h6>
            <!-- container -->
            <div id="videoWrap" class="ratio ratio-16x9 bg-dark rounded-3 overflow-hidden">
              <!-- MP4 -->
              <video id="video" controls style="width:100%;height:100%" class="d-none"></video>
              <!-- YouTube -->
              <iframe id="videoFrame" class="d-none" style="width:100%;height:100%;border:0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>
              <!-- message -->
              <div id="videoMsg" class="d-none text-white p-3 small"
                style="display:flex;align-items:center;justify-content:center;text-align:center;">
              </div>
            </div>
          </div>
          <div class="mt-4">
            <h6>Tài liệu</h6>
            <a id="docLink" class="btn btn-outline-secondary d-none" target="_blank">
              Tải / Xem tài liệu
            </a>
            <div id="docMsg" class="small text-muted d-none"></div>
          </div>

        </div>
        <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
      </div>
    </div>
    <div id="appFooter"></div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/lesson.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

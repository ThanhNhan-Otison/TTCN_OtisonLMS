<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OtisonLMS - Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link  href="assets/css/footer.css" rel="stylesheet">
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/nav.js"></script>
<script>requireAuth();</script>

<div id="appNav"></div>

<div class="container py-4">
  <div class="card shadow-soft p-4">
    <h4>Quiz (theo bài học)</h4>
    <div class="row g-2 mt-2">
      <div class="col-md-4">
        <input id="lessonId" class="form-control" type="number" placeholder="lessonId">
      </div>
      <div class="col-md-2">
        <button id="btnLoad" class="btn btn-primary w-100">Tải Quiz</button>
      </div>
    </div>

    <div class="mt-4" id="quizBox"></div>
    <button id="btnSubmit" class="btn btn-success mt-3" style="display:none;">Nộp</button>
  </div>

  <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
</div>

<script src="assets/js/ui.js"></script>
<script src="assets/js/quiz.js"></script>
  <div id="appFooter"></div>
    <script src="assets/js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng ký tài khoản - OtisonLMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link  href="assets/css/footer.css" rel="stylesheet">
</head>
<body>

<!-- <script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/nav.js"></script>
<script>requireAuth();</script> -->

<div id="appNav"></div>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-soft p-4">
        <h2 class="mb-4 text-center">Đăng ký tài khoản</h2>
        <form id="registerForm" class="vstack gap-3">
          <div>
            <label class="form-label">Họ và tên</label>
            <input class="form-control" id="fullName" required placeholder="Nguyễn Văn A">
          </div>
          <div>
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required placeholder="ban@stu.edu.vn">
          </div>
          <div>
            <label class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" id="password" required placeholder="Mật khẩu">
          </div>
          <div>
            <label class="form-label">Nhập lại mật khẩu</label>
            <input type="password" class="form-control" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
          </div>
          <div>
            <label class="form-label">Phân quyền</label>
            <select class="form-select" id="role" required>
              <option value="USER">USER</option>
              <option value="TEACHER">TEACHER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <button class="btn btn-success w-100" type="submit">Đăng ký</button>
        </form>
        <div class="text-center mt-3">
          <a href="login.html">Đã có tài khoản? Đăng nhập</a>
        </div>
        <div id="registerStatus" class="mt-3 text-center text-danger small"></div>
      </div>
    </div>
  </div>
</main>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var fullName = document.getElementById('fullName').value.trim();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  var role = document.getElementById('role').value;
  var status = document.getElementById('registerStatus');
  status.textContent = '';
  if (!fullName || !email || !password || !confirmPassword || !role) {
    status.textContent = 'Vui lòng điền đầy đủ thông tin.';
    status.classList.remove('text-success');
    status.classList.add('text-danger');
    return;
  }
  if (password !== confirmPassword) {
    status.textContent = 'Mật khẩu nhập lại không khớp.';
    status.classList.remove('text-success');
    status.classList.add('text-danger');
    return;
  }
  try {
    status.textContent = 'Đang xử lý...';
    status.classList.remove('text-danger', 'text-success');
    // Gửi dữ liệu đến API thực tế
    const res = await fetch('http://localhost:8080/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firstName: fullName, email, password, role })
    });
    const data = await res.json();
    if (!res.ok) {
      status.textContent = data.message || 'Đăng ký thất bại.';
      status.classList.remove('text-success');
      status.classList.add('text-danger');
      return;
    }
    status.classList.remove('text-danger');
    status.classList.add('text-success');
    status.textContent = 'Đăng ký thành công! Bạn có thể đăng nhập.';
    setTimeout(function(){ window.location.href = 'login.html'; }, 1500);
  } catch (err) {
    status.textContent = 'Lỗi kết nối máy chủ.';
    status.classList.remove('text-success');
    status.classList.add('text-danger');
  }
});
</script>
  <div id="appFooter"></div>
    <script src="assets/js/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

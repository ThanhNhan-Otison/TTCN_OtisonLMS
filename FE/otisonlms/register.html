<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký tài khoản - OtisonLMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <div class="page-wrapper">
    <div id="appNav"></div>
    <div class="main-content">
      <main class="container py-5">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-6">
            <div class="card shadow-soft p-4">
              <h2 class="mb-4 text-center">Đăng ký tài khoản</h2>
              <form id="registerForm" class="vstack gap-3">
                <div>
                  <label class="form-label">Họ và tên</label>
                  <input class="form-control" id="fullName" required placeholder="Nguyễn Văn A">
                </div>
                <div>
                  <label class="form-label">Ngày sinh</label>
                  <input type="date" class="form-control" id="ngaySinh" required>
                </div>

                <div>
                  <label class="form-label">Số điện thoại</label>
                  <input type="tel" class="form-control" id="soDienThoai" required placeholder="0123456789">
                </div>

                <div>
                  <label class="form-label">Giới tính</label>
                  <div class="d-flex gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gioiTinh" id="gtNam" value="true" required>
                      <label class="form-check-label" for="gtNam">Nam</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gioiTinh" id="gtNu" value="false">
                      <label class="form-check-label" for="gtNu">Nữ</label>
                    </div>
                  </div>
                </div>

                <div>
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required placeholder="ban@stu.edu.vn">
                </div>
                <div>
                  <label class="form-label">Mật khẩu</label>
                  <input type="password" class="form-control" id="password" required placeholder="Mật khẩu">
                </div>
                <div>
                  <label class="form-label">Nhập lại mật khẩu</label>
                  <input type="password" class="form-control" id="confirmPassword" required
                    placeholder="Nhập lại mật khẩu">
                </div>
                <div>
                  <label class="form-label">Phân quyền</label>
                  <select class="form-select" id="role" required>
                    <option value="USER">STUDENT</option>
                    <option value="TEACHER">TEACHER</option>
                  </select>
                </div>
                <button class="btn btn-success w-100" type="submit">Đăng ký</button>
              </form>
              <div class="text-center mt-3">
                <a href="login.html">Đã có tài khoản? Đăng nhập</a>
              </div>
              <div id="registerStatus" class="mt-3 text-center text-danger small"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="appFooter"></div>
  </div>
 <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/register.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

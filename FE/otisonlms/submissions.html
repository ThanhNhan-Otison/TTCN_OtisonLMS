<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtisonLMS - Bài nộp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/footer.css" rel="stylesheet">
</head>

<body>
  <div class="page-wrapper">
    <div id="appNav"></div>

    <div class="main-content" style="
      background-image: url('assets/img/bg2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;">
      <div class="container py-4">

        <div class="d-flex align-items-center mb-3">
          <h4 class="mb-0 me-auto">Bài nộp</h4>
          <div class="small-muted me-2" id="stats"></div>
          <span class="badge badge-soft" id="modeTag">...</span>
        </div>

        <!-- ✅ LIST SUBMISSIONS -->
        <div class="card shadow-soft p-4">
          <ul class="list-group" id="list"></ul>
        </div>

        <div id="toastWrap" class="position-fixed bottom-0 end-0 p-3" style="z-index:1055;"></div>
      </div>
    </div>

    <div id="appFooter"></div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>requireAuth();</script>

  <!-- ✅ submissions.js đặt SAU DOM -->
  <script src="assets/js/submissions.js"></script>

  <script src="assets/js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Grade Modal (Teacher/Admin) -->
  <div class="modal fade" id="gradeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="gradeForm">
        <div class="modal-header">
          <h5 class="modal-title">Chấm điểm bài nộp</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="gradeSubmissionId">

          <div class="mb-3">
            <label class="form-label">Điểm</label>
            <input type="number" step="0.1" min="0" class="form-control" id="gradeScore" required>
            <div class="form-text">Nhập điểm (ví dụ: 8.5)</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Nhận xét</label>
            <textarea class="form-control" id="gradeFeedback" rows="3"
              placeholder="Nhận xét (có thể để trống)"></textarea>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="notifyStudent" checked>
            <label class="form-check-label" for="notifyStudent">
              Gửi thông báo cho sinh viên
            </label>
          </div>

          <div class="small-muted mt-2" id="gradeTargetInfo"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary" id="gradeSubmitBtn">Lưu điểm</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
